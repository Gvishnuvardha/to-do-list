<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>To-dos</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <div class="app-container">

        <header class="header">
            <div>
                <h1>To-dos</h1>
                <div class="task-count" id="taskCount">0 to-dos</div>
            </div>
        </header>

        <div class="filter-wrapper">
            <select id="filterSelect">
                <option value="all">All</option>
                <option value="active">Active</option>
                <option value="completed">Completed</option>
            </select>
        </div>

        <main class="tasks-wrapper">

            <ul class="task-list" id="activeTaskList"></ul>

            <section class="done-section hidden" id="doneSection">
                <h2 id="doneHeader">Done (0)</h2>
                <ul class="task-list" id="completedTaskList"></ul>
            </section>

        </main>

        <button class="fab" id="fabBtn">+</button>

        <nav class="bottom-nav">
            <div class="nav-item active">
                <span class="nav-icon">✓</span>
                <span>To-dos</span>
            </div>
        </nav>

    </div>

    <div class="modal hidden" id="taskModal">

        <div class="modal-content">

            <h3 id="modalTitle">New To-do</h3>

            <input type="text"
                   id="taskInput"
                   placeholder="Enter task">

            <div class="modal-actions">
                <button class="btn-cancel" id="cancelModalBtn">
                    Cancel
                </button>

                <button class="btn-save" id="saveTaskBtn">
                    Save
                </button>
            </div>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
